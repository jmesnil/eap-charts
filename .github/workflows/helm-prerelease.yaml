name: Prerelease of Helm Chart

on:
  release:
    types: [prereleased]

  workflow_dispatch:

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v1
        with:
          version: v3.4.0

      - name: Create the Helm Chart 
        run: |
          rm -rf .helm-package
          mkdir .helm-package
          helm package -u charts/* -d .helm-package
     
      - name: Upload the Release
        uses: softprops/action-gh-release@v1
        with:
          files: .helm-package/**